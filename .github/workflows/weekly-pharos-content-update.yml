name: Weekly Pharos content update

# Runs every Sunday at 13:00 UTC (= 20:00 Asia/Saigon). Researches the latest
# Pharos Network news/developments/stats via the Gemini API (web) and
# Grok's x_search tool (X posts — where most
# Pharos updates are announced first). Also checks the official ecosystem
# sources for partners/projects missing from our directory, updates the site
# content in public/js/data.js, and opens a PR for review. Never pushes to main.
on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Minimum research lookback in days (14–365)"
        default: "28"
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: weekly-pharos-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Test content pipeline
        run: node --test scripts/content-pipeline.test.js

      - name: Restore coverage and unresolved candidates
        id: state
        uses: actions/cache/restore@v4
        with:
          path: .content-state
          key: pharos-content-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pharos-content-state-v1-${{ github.ref_name }}-

      # Weekly caches can be evicted between runs; retained artifacts provide recovery.
      - name: Recover state from last retained artifact
        if: steps.state.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > /tmp/content-artifacts.json
          node scripts/restore-content-state.js

      - name: Research and update content (Gemini + Grok)
        id: research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          CONTENT_LOOKBACK_DAYS: ${{ inputs.lookback_days || '28' }}
          # Required: failed X coverage must not look like a quiet news week.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: grok-4.3
        run: node scripts/update-pharos-content.js

      - name: Save coverage and unresolved candidates
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .content-state
          key: pharos-content-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            content-artifacts/
            .content-state/state.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

      - name: Read change flag
        if: ${{ !cancelled() && steps.research.outcome != 'skipped' }}
        id: flag
        run: echo "changed=$(cat has-changes.txt 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: Verify build
        id: build
        if: ${{ !cancelled() && steps.flag.outputs.changed == 'true' }}
        run: npm run build

      - name: Create pull request
        if: ${{ !cancelled() && steps.flag.outputs.changed == 'true' && steps.build.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: public/js/data.js
          branch: content/weekly-update
          delete-branch: true
          commit-message: "chore(content): weekly Pharos content refresh"
          title: "Cập nhật nội dung Pharos hàng tuần"
          body-path: pr-body.md
          labels: |
            content
            automated
